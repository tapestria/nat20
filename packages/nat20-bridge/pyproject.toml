[project]
name = "nat20-bridge"
version = "0.8.2"
description = "Nat20 over HTTP: a localhost REST API for D&D 5e SRD 5.2 rolls, checks and full combat. The backend of the SillyTavern nat20 extension."
readme = "README.md"
keywords = ["nat20", "dnd", "dnd5e", "5e", "srd", "ttrpg", "rules-engine", "sillytavern", "fastapi", "rest-api", "game-master"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
]
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # Lockstep floors: the bridge imports OverlayAssetLoader from
    # dnd5e-srd-data, which ships it from 0.8.1.
    "dnd5e-engine>=0.8.1",
    "dnd5e-srd-data>=0.8.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/tapestria/nat20"
Documentation = "https://tapestria.github.io/nat20/"
Repository = "https://github.com/tapestria/nat20"
Issues = "https://github.com/tapestria/nat20/issues"
Changelog = "https://github.com/tapestria/nat20/releases"

[project.scripts]
nat20-bridge = "nat20_bridge.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "bandit>=1.8.0",
]

[tool.uv.sources]
dnd5e-engine = { workspace = true }
dnd5e-srd-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat20_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "T20", "BLE",
    "C90", "ASYNC", "PT", "RUF", "TRY",
]
ignore = [
    "TRY003",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E501", "F841", "PT006", "PT011", "C901",
    "PT018", "N806", "BLE001", "SIM102",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["nat20_bridge"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]

# tests carry asserts (B101); the roll/check/rest routes hand the engine a
# seeded `random.Random` so a request's dice are reproducible (B311) — game
# dice, not a security concern.
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnd5e-engine"
version = "0.8.0"
description = "Nat20 rules engine: deterministic D&D 5e SRD 5.2 combat, checks and effects in pure Python. Host-agnostic, zero I/O."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Tapestria contributors" }]
keywords = ["nat20", "dnd", "dnd5e", "5e", "srd", "srd-5.2", "ttrpg", "tabletop-rpg", "rules-engine", "combat", "dice", "game-master"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10.0",
    "d20>=1.1.2",
    # lib_loader imports BundledAssetLoader at runtime; the typed-Activity
    # resolver reads the canonical corpus through it. The data lib's >=3.12
    # floor is why this package now also requires >=3.12 (see requires-python).
    # Lockstep floor, raised at each minor: srd-data 0.8.0 changes no data,
    # and the engine relies on everything new in 0.7.0 (Feat.repeatable, the
    # canonical feat slug in Background.starting_feat_slug, the corrected area
    # choice flags, counts and recharges).
    "dnd5e-srd-data>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/tapestria/nat20"
Documentation = "https://tapestria.github.io/nat20/"
Repository = "https://github.com/tapestria/nat20"
Issues = "https://github.com/tapestria/nat20/issues"
Changelog = "https://github.com/tapestria/nat20/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
]

[tool.uv.sources]
dnd5e-srd-data = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dnd5e_engine"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# d20 ships no py.typed marker / stubs.
[[tool.mypy.overrides]]
module = ["d20"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "T20", "BLE",
    "C90", "ASYNC", "PT", "RUF", "TRY",
]
ignore = [
    "TRY003",
    "RUF001", "RUF002", "RUF003",
]

# Baseline-and-ratchet: set at the worst function observed today
# (submit_player_intent=23, in orchestrator.py). Ratcheted down from 56
# after extracting the orchestrator hotspots (_emit 49→12, start_combat
# 34→3, _build_hydration_payload 36→6). A PR past this must justify it;
# keep ratcheting DOWN.
[tool.ruff.lint.mccabe]
max-complexity = 23

[tool.ruff.lint.per-file-ignores]
# Test bodies are allowed to be branchy/repetitive (C901) and print (T201).
"tests/**/*.py" = ["E501", "F841", "PT006", "PT011", "C901"]
# Smoke scripts print human-readable progress/result lines (T201) by design.
"scripts/**/*.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Any DeprecationWarning the engine itself raises is a bug.
    "error::DeprecationWarning:dnd5e_engine",
]

[tool.coverage.run]
source = ["dnd5e_engine"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]

# Recursive scan of src/ only; tests carry asserts (B101) and the engine
# rolls dice with the stdlib RNG (B311) — neither is a security concern.
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311"]
